<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CSS Scraper + Assets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-size: 14px; }
    .progress-bar { transition: width 0.15s ease; }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">
  <!-- Header -->
  <header class="bg-white shadow-sm px-3 py-2 flex items-center gap-2 flex-shrink-0">
    <i class="fa-solid fa-scroll text-blue-600 text-lg"></i>
    <h1 class="text-base font-semibold text-gray-800">CSS Scraper + Assets</h1>
  </header>

  <!-- Main (scrollable if needed) -->
  <main class="flex-1 overflow-y-auto p-2 flex items-start justify-center">
    <div class="w-full max-w-md space-y-2 mt-2">
      <div class="space-y-1">
        <label class="block text-xs text-gray-600">CSS file URL</label>
        <div class="flex gap-1">
          <input id="urlInput" type="url" placeholder="https://example.com/style.css"
                 class="flex-1 px-2 py-1.5 text-xs border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-400">
          <button id="fetchBtn" class="px-3 py-1.5 bg-blue-600 text-white text-xs rounded hover:bg-blue-700 transition">
            <i class="fa-solid fa-download mr-1"></i>Scrape
          </button>
        </div>
      </div>

      <!-- Progress area -->
      <div id="progressContainer" class="hidden space-y-1">
        <div class="flex justify-between text-xs text-gray-500">
          <span id="progressPercent">0%</span>
          <span id="progressSize">0 / 0 KB</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div id="progressBar" class="progress-bar bg-blue-600 h-2 rounded-full" style="width: 0%"></div>
        </div>
        <p id="progressDetail" class="text-xs text-gray-500">Preparing...</p>
      </div>

      <!-- Download button -->
      <a id="downloadBtn" class="hidden w-full flex items-center justify-center gap-1 px-3 py-1.5 bg-green-600 text-white text-xs rounded hover:bg-green-700 transition">
        <i class="fa-solid fa-file-zipper"></i> Download jCss.zip
      </a>

      <p id="errorMsg" class="hidden text-xs text-red-600"></p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t px-3 py-1.5 flex-shrink-0 text-xs text-gray-500 text-center">
    <i class="fa-regular fa-copyright"></i> CSS Scraper Tool
  </footer>

  <script>
    const PROXY = 'https://fetch-css.vercel.app/api/fetch-css';

    const urlInput = document.getElementById('urlInput');
    const fetchBtn = document.getElementById('fetchBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const progressSize = document.getElementById('progressSize');
    const progressDetail = document.getElementById('progressDetail');
    const downloadBtn = document.getElementById('downloadBtn');
    const errorMsg = document.getElementById('errorMsg');

    fetchBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) return;

      errorMsg.classList.add('hidden');
      downloadBtn.classList.add('hidden');
      progressContainer.classList.remove('hidden');
      setProgress(0, 0, 0, 'Fetching CSS...');

      try {
        const cssResponse = await fetch(`${PROXY}?url=${encodeURIComponent(url)}`);
        if (!cssResponse.ok) {
          const err = await cssResponse.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${cssResponse.status}`);
        }
        const cssText = await cssResponse.text();
        const cssByteLength = new Blob([cssText]).size;

        const urlRegex = /url\(\s*["']?(?!data:)([^"')]+)["']?\s*\)/gi;
        const rawMatches = [...cssText.matchAll(urlRegex)];

        const cssBaseUrl = url.substring(0, url.lastIndexOf('/') + 1);
        const resolvedUrls = new Map();

        rawMatches.forEach(match => {
          let path = match[1].trim().replace(/^["']|["']$/g, '');
          if (path.startsWith('http://') || path.startsWith('https://') || path.startsWith('//')) return;
          try {
            const absoluteUrl = new URL(path, cssBaseUrl).href;
            if (!resolvedUrls.has(absoluteUrl)) {
              let filename = absoluteUrl.substring(absoluteUrl.lastIndexOf('/') + 1);
              const qIndex = filename.indexOf('?');
              if (qIndex !== -1) filename = filename.substring(0, qIndex);
              if (!filename) filename = 'asset';
              let unique = filename;
              let counter = 1;
              const usedNames = new Set(resolvedUrls.values());
              while (usedNames.has(unique)) {
                const dot = filename.lastIndexOf('.');
                unique = dot !== -1
                  ? filename.substring(0, dot) + `_${counter}` + filename.substring(dot)
                  : filename + `_${counter}`;
                counter++;
              }
              resolvedUrls.set(absoluteUrl, unique);
            }
          } catch {}
        });

        const assetEntries = Array.from(resolvedUrls.entries());
        let downloadedBytes = cssByteLength;
        setProgress(0, 0, downloadedBytes, `Fetched CSS (${formatBytes(cssByteLength)})`);

        const zip = new JSZip();
        const cssFilename = url.substring(url.lastIndexOf('/') + 1) || 'style.css';
        zip.file(cssFilename, cssText);
        const imageFolder = zip.folder("images");

        for (let i = 0; i < assetEntries.length; i++) {
          const [assetUrl, localName] = assetEntries[i];
          progressDetail.textContent = `Asset ${i+1}/${assetEntries.length}: ${localName}`;
          try {
            const assetResponse = await fetch(`${PROXY}?url=${encodeURIComponent(assetUrl)}`);
            if (!assetResponse.ok) continue;
            const reader = assetResponse.body.getReader();
            const chunks = [];
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              downloadedBytes += value.length;
              setProgress(0, 0, downloadedBytes,
                `Asset ${i+1}/${assetEntries.length}: ${localName}`);
            }
            imageFolder.file(localName, new Blob(chunks));
          } catch (e) { console.warn(`Skipped ${assetUrl}: ${e.message}`); }
        }

        progressDetail.textContent = 'Building zip...';
        const zipBlob = await zip.generateAsync({ type: 'blob' }, meta =>
          setProgress(meta.percent, 100, downloadedBytes, `Compressing... ${meta.percent.toFixed(0)}%`)
        );

        const blobUrl = URL.createObjectURL(zipBlob);
        downloadBtn.href = blobUrl;
        downloadBtn.download = 'jCss.zip';
        downloadBtn.classList.remove('hidden');
        progressDetail.textContent = 'Done! Click to download.';
        setProgress(100, 100, downloadedBytes, 'Complete');
        downloadBtn.addEventListener('click', () => setTimeout(() => URL.revokeObjectURL(blobUrl), 2000), { once: true });

      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
        progressContainer.classList.add('hidden');
      }
    });

    function setProgress(value, max, bytes, text) {
      const pct = max ? Math.round((value / max) * 100) : 0;
      progressPercent.textContent = max ? `${pct}%` : '...';
      progressSize.textContent = formatBytes(bytes);
      progressBar.style.width = max ? `${pct}%` : '50%';
      if (text) progressDetail.textContent = text;
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      if (bytes < 1024) return bytes + ' B';
      const kb = bytes / 1024;
      return kb < 1024 ? kb.toFixed(1) + ' KB' : (kb / 1024).toFixed(2) + ' MB';
    }
  </script>
</body>
</html>
