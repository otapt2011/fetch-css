<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CSS Scraper – Self‑Contained</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- JSZip CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-size: 14px; }
    .progress-bar { transition: width 0.15s ease; }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">
  <!-- Header -->
<header class="bg-white shadow-sm px-3 py-2 flex items-center gap-2 flex-shrink-0">
  <i class="fa-solid fa-scroll text-blue-600 text-lg"></i>
  <h1 class="text-base font-semibold text-gray-800">CSS Scraper + Assets</h1>
  <a href="multi.html" class="ml-auto text-xs text-blue-600 hover:text-blue-800 transition">
    <i class="fa-solid fa-layer-group mr-1"></i>Multi
  </a>
</header>

  <!-- Main (scrollable if content overflows) -->
  <main class="flex-1 overflow-y-auto p-2 flex items-start justify-center">
    <div class="w-full max-w-md space-y-2 mt-2">
      <div class="space-y-1">
        <label class="block text-xs text-gray-600">CSS file URL</label>
        <div class="flex gap-1">
          <input id="urlInput" type="url" placeholder="https://example.com/style.css"
                 class="flex-1 px-2 py-1.5 text-xs border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-400">
          <button id="fetchBtn" class="px-3 py-1.5 bg-blue-600 text-white text-xs rounded hover:bg-blue-700 transition">
            <i class="fa-solid fa-download mr-1"></i>Scrape
          </button>
        </div>
      </div>

      <!-- Progress area -->
      <div id="progressContainer" class="hidden space-y-1">
        <div class="flex justify-between text-xs text-gray-500">
          <span id="progressPercent">0%</span>
          <span id="progressSize">0 / 0 KB</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div id="progressBar" class="progress-bar bg-blue-600 h-2 rounded-full" style="width: 0%"></div>
        </div>
        <p id="progressDetail" class="text-xs text-gray-500">Preparing...</p>
      </div>

      <!-- Download button (hidden initially) -->
      <a id="downloadBtn" class="hidden w-full flex items-center justify-center gap-1 px-3 py-1.5 bg-green-600 text-white text-xs rounded hover:bg-green-700 transition">
        <i class="fa-solid fa-file-zipper"></i> Download jCss.zip
      </a>

      <p id="errorMsg" class="hidden text-xs text-red-600"></p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t px-3 py-1.5 flex-shrink-0 text-xs text-gray-500 text-center">
    <i class="fa-regular fa-copyright"></i> CSS Scraper Tool
  </footer>

  <script>
    // Your deployed proxy URL
    const PROXY = 'https://fetch-css.vercel.app/api/fetch-css';

    // Extensions mapping for categorization
    const imageExtensions = new Set(['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'ico', 'bmp', 'tiff']);
    const fontExtensions = new Set(['woff', 'woff2', 'ttf', 'otf', 'eot']);

    function getCategoryFromFilename(filename) {
      const ext = filename.substring(filename.lastIndexOf('.') + 1).toLowerCase();
      if (imageExtensions.has(ext)) return 'images';
      if (fontExtensions.has(ext)) return 'fonts';
      return 'assets';
    }

    // DOM elements
    const urlInput = document.getElementById('urlInput');
    const fetchBtn = document.getElementById('fetchBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const progressSize = document.getElementById('progressSize');
    const progressDetail = document.getElementById('progressDetail');
    const downloadBtn = document.getElementById('downloadBtn');
    const errorMsg = document.getElementById('errorMsg');

    fetchBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) return;

      // Reset UI
      errorMsg.classList.add('hidden');
      downloadBtn.classList.add('hidden');
      progressContainer.classList.remove('hidden');
      setProgress(0, 0, 0, 'Fetching CSS...');

      try {
        // --- 1. Fetch the original CSS ---
        const cssResponse = await fetch(`${PROXY}?url=${encodeURIComponent(url)}`);
        if (!cssResponse.ok) {
          const err = await cssResponse.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${cssResponse.status}`);
        }
        const originalCss = await cssResponse.text();
        const cssByteLength = new Blob([originalCss]).size;

        // --- 2. Extract all url() references (ignore data URIs) ---
        const urlRegex = /url\(\s*["']?(?!data:)([^"')]+)["']?\s*\)/gi;
        const matches = [...originalCss.matchAll(urlRegex)];

        // Base URL of the CSS for resolving relative paths
        const cssBaseUrl = url.substring(0, url.lastIndexOf('/') + 1);

        // Map: absolute asset URL -> { localName, category }
        const assetMap = new Map();

        // Also store the match details for later rewriting
        // We'll store: { match, path, startIndex, endIndex }
        const matchDetails = [];

        matches.forEach(match => {
          let rawPath = match[1].trim().replace(/^["']|["']$/g, '');
          // Skip absolute URLs
          if (rawPath.startsWith('http://') || rawPath.startsWith('https://') || rawPath.startsWith('//')) return;

          try {
            const absoluteUrl = new URL(rawPath, cssBaseUrl).href;

            if (!assetMap.has(absoluteUrl)) {
              let filename = absoluteUrl.substring(absoluteUrl.lastIndexOf('/') + 1);
              // Strip query string from filename
              const qIndex = filename.indexOf('?');
              if (qIndex !== -1) filename = filename.substring(0, qIndex);
              if (!filename) filename = 'asset';

              // Ensure unique local name
              let unique = filename;
              let counter = 1;
              const usedNames = new Set(
                Array.from(assetMap.values()).map(v => v.localName)
              );
              while (usedNames.has(unique)) {
                const dot = filename.lastIndexOf('.');
                unique = dot !== -1
                  ? filename.substring(0, dot) + `_${counter}` + filename.substring(dot)
                  : filename + `_${counter}`;
                counter++;
              }

              const category = getCategoryFromFilename(filename);
              assetMap.set(absoluteUrl, { localName: unique, category });
            }

            // Record match for later replacement
            matchDetails.push({
              match: match[0],          // full url(...) string
              absoluteUrl: absoluteUrl,
              start: match.index,       // position in original CSS string
              end: match.index + match[0].length
            });
          } catch (e) {
            // Ignore malformed URLs
          }
        });

        const assetEntries = Array.from(assetMap.entries());
        let downloadedBytes = cssByteLength;
        setProgress(0, 0, downloadedBytes, `Fetched CSS (${formatBytes(cssByteLength)})`);

        // --- 3. Download all assets via proxy ---
        // We'll store the downloaded blobs along with their category and local name
        const downloadedAssets = []; // { localName, category, blob }

        for (let i = 0; i < assetEntries.length; i++) {
          const [assetUrl, { localName, category }] = assetEntries[i];
          progressDetail.textContent = `Asset ${i+1}/${assetEntries.length}: ${localName}`;
          try {
            const assetResponse = await fetch(`${PROXY}?url=${encodeURIComponent(assetUrl)}`);
            if (!assetResponse.ok) continue;

            // Stream-read the asset while updating progress
            const reader = assetResponse.body.getReader();
            const chunks = [];
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              downloadedBytes += value.length;
              setProgress(0, 0, downloadedBytes,
                `Asset ${i+1}/${assetEntries.length}: ${localName}`);
            }
            downloadedAssets.push({ localName, category, blob: new Blob(chunks) });
          } catch (e) {
            console.warn(`Skipped ${assetUrl}: ${e.message}`);
          }
        }

        // --- 4. Rewrite CSS to point to local paths ---
        // Build a mapping from absolute URL to the new local path (relative to zip root)
        const urlToLocalPath = new Map();
        assetMap.forEach(({ localName, category }, absoluteUrl) => {
          // The local path inside the zip (e.g., "images/bg.png")
          urlToLocalPath.set(absoluteUrl, `${category}/${localName}`);
        });

        // Rewrite the CSS string
        let rewrittenCss = originalCss;
        // Process matches in reverse order so indices remain valid
        matchDetails
          .sort((a, b) => b.start - a.start)
          .forEach(({ start, end, absoluteUrl, match }) => {
            const localPath = urlToLocalPath.get(absoluteUrl);
            if (localPath) {
              // Replace the whole url(...) with the new local path, preserving quotes if any
              const hasQuotes = /url\(\s*["']/.test(match);
              const newUrl = hasQuotes ? `url("${localPath}")` : `url(${localPath})`;
              rewrittenCss = rewrittenCss.substring(0, start) + newUrl + rewrittenCss.substring(end);
            }
          });

        // --- 5. Build the zip ---
        progressDetail.textContent = 'Building zip...';
        const zip = new JSZip();

        // Determine CSS filename from the original URL (strip query string)
        const parsedUrl = new URL(url);
        let cssFilename = parsedUrl.pathname.substring(parsedUrl.pathname.lastIndexOf('/') + 1);
        if (!cssFilename) cssFilename = 'style.css';
        // Also strip any accidental query from filename
        const qIdx = cssFilename.indexOf('?');
        if (qIdx !== -1) cssFilename = cssFilename.substring(0, qIdx);

        // Add the rewritten CSS
        zip.file(cssFilename, rewrittenCss);

        // Add all assets to their respective folders
        downloadedAssets.forEach(({ localName, category, blob }) => {
          zip.folder(category).file(localName, blob);
        });

        // Generate zip blob
        const zipBlob = await zip.generateAsync({ type: 'blob' }, meta => {
          setProgress(meta.percent, 100, downloadedBytes,
            `Compressing... ${meta.percent.toFixed(0)}%`);
        });

        // --- 6. Enable download ---
        const blobUrl = URL.createObjectURL(zipBlob);
        downloadBtn.href = blobUrl;
        downloadBtn.download = 'jCss.zip';
        downloadBtn.classList.remove('hidden');
        progressDetail.textContent = 'Done! Click to download.';
        setProgress(100, 100, downloadedBytes, 'Complete');

        // Cleanup object URL after download
        downloadBtn.addEventListener('click', () => {
          setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
        }, { once: true });

      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
        progressContainer.classList.add('hidden');
      }
    });

    // Helper: update progress UI
    function setProgress(value, max, bytes, text) {
      const pct = max ? Math.round((value / max) * 100) : 0;
      progressPercent.textContent = max ? `${pct}%` : '...';
      progressSize.textContent = formatBytes(bytes);
      progressBar.style.width = max ? `${pct}%` : '50%';
      if (text) progressDetail.textContent = text;
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      if (bytes < 1024) return bytes + ' B';
      const kb = bytes / 1024;
      return kb < 1024 ? kb.toFixed(1) + ' KB' : (kb / 1024).toFixed(2) + ' MB';
    }
  </script>
</body>
</html>
