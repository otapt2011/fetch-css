<!DOCTYPE html>
<html lang="en">
<head>

  <title>CSS Scraper</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- JSZip (required by cssScrapper.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- External unified scraper module -->
  <script src="cssScrapper.js"></script>
  <style>
    body { font-size: 14px; }
    .progress-bar { transition: width 0.1s linear; }
    textarea { resize: vertical; }
    .tab-btn.active { background-color: #2563eb; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">
  <!-- Header -->
  <header class="bg-white shadow-sm px-3 py-2 flex items-center gap-2 flex-shrink-0">
    <i class="fa-solid fa-scroll text-blue-600 text-lg"></i>
    <h1 class="text-base font-semibold text-gray-800">CSS Scraper</h1>
    <span class="ml-auto text-xs text-gray-500">Single &amp; Multi</span>
  </header>

  <!-- Main -->
  <main class="flex-1 overflow-y-auto p-2 flex items-start justify-center">
    <div class="w-full max-w-md space-y-2 mt-2">
      <!-- Tab buttons -->
      <div class="flex gap-1">
        <button id="tabSingle" class="tab-btn active flex-1 px-3 py-1.5 text-xs rounded border border-blue-600 bg-blue-600 text-white transition">
          <i class="fa-solid fa-file mr-1"></i>Single CSS
        </button>
        <button id="tabMulti" class="tab-btn flex-1 px-3 py-1.5 text-xs rounded border border-gray-300 text-gray-600 hover:bg-gray-50 transition">
          <i class="fa-solid fa-layer-group mr-1"></i>Multiple CSS
        </button>
      </div>

      <!-- Single CSS input -->
      <div id="panelSingle" class="tab-content active space-y-2">
        <div class="space-y-1">
          <label class="block text-xs text-gray-600">CSS file URL</label>
          <div class="flex gap-1">
            <input id="singleUrl" type="url" placeholder="https://example.com/style.css"
                   class="flex-1 px-2 py-1.5 text-xs border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-400">
            <button id="scrapeSingleBtn" class="px-3 py-1.5 bg-blue-600 text-white text-xs rounded hover:bg-blue-700 transition">
              <i class="fa-solid fa-download mr-1"></i>Scrape
            </button>
          </div>
        </div>
      </div>

      <!-- Multi CSS input -->
      <div id="panelMulti" class="tab-content space-y-2">
        <div class="space-y-1">
          <label class="block text-xs text-gray-600">JSON array of CSS URLs</label>
          <textarea id="multiJson" rows="5" placeholder='["https://example.com/a.css", "https://example.com/b.css"]'
                    class="w-full px-2 py-1.5 text-xs border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-400"></textarea>
          <div class="flex gap-1">
            <button id="sampleBtn" class="flex-1 px-3 py-1.5 bg-emerald-600 text-white text-xs rounded hover:bg-emerald-700 transition">
              <i class="fa-solid fa-flask mr-1"></i>Scrape Sample
            </button>
            <button id="scrapeMultiBtn" class="flex-1 px-3 py-1.5 bg-blue-600 text-white text-xs rounded hover:bg-blue-700 transition">
              <i class="fa-solid fa-download mr-1"></i>Scrape All
            </button>
          </div>
        </div>
      </div>

      <!-- Progress area (shared) -->
      <div id="progressContainer" class="hidden space-y-2">
        <!-- Overall (for multi) or generic -->
        <div class="flex justify-between text-xs text-gray-600">
          <span id="overallCount">0/0</span>
          <span id="overallSize">0 KB</span>
        </div>
        <!-- Per-file progress -->
        <div class="space-y-1">
          <div class="flex justify-between text-xs text-gray-500">
            <span id="currentPercent">0%</span>
            <span id="currentFile">—</span>
          </div>
          <div class="w-full bg-gray-200 rounded-full h-2">
            <div id="progressBar" class="progress-bar bg-blue-600 h-2 rounded-full" style="width: 0%"></div>
          </div>
          <p id="progressDetail" class="text-xs text-gray-500">Preparing...</p>
        </div>
      </div>

      <!-- Download button -->
      <a id="downloadBtn" class="hidden w-full flex items-center justify-center gap-1 px-3 py-1.5 bg-green-600 text-white text-xs rounded hover:bg-green-700 transition">
        <i class="fa-solid fa-file-zipper"></i> Download jCss.zip
      </a>

      <!-- Error message -->
      <p id="errorMsg" class="hidden text-xs text-red-600"></p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t px-3 py-1.5 flex-shrink-0 text-xs text-gray-500 text-center">
    <i class="fa-regular fa-copyright"></i> CSS Scraper Tool &mdash; Unified Module
  </footer>

  <!-- ======================== UI CONTROLLER ======================== -->
  <script>
    // DOM references
    const tabSingle = document.getElementById('tabSingle');
    const tabMulti = document.getElementById('tabMulti');
    const panelSingle = document.getElementById('panelSingle');
    const panelMulti = document.getElementById('panelMulti');
    const singleUrl = document.getElementById('singleUrl');
    const scrapeSingleBtn = document.getElementById('scrapeSingleBtn');
    const multiJson = document.getElementById('multiJson');
    const scrapeMultiBtn = document.getElementById('scrapeMultiBtn');
    const sampleBtn = document.getElementById('sampleBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const currentPercent = document.getElementById('currentPercent');
    const currentFile = document.getElementById('currentFile');
    const progressDetail = document.getElementById('progressDetail');
    const overallCount = document.getElementById('overallCount');
    const overallSize = document.getElementById('overallSize');
    const downloadBtn = document.getElementById('downloadBtn');
    const errorMsg = document.getElementById('errorMsg');

    // Tab switching
    function activateTab(single) {
      if (single) {
        tabSingle.classList.add('active', 'bg-blue-600', 'text-white', 'border-blue-600');
        tabSingle.classList.remove('border-gray-300', 'text-gray-600', 'bg-white');
        tabMulti.classList.remove('active', 'bg-blue-600', 'text-white', 'border-blue-600');
        tabMulti.classList.add('border-gray-300', 'text-gray-600', 'bg-white');
        panelSingle.classList.add('active');
        panelMulti.classList.remove('active');
      } else {
        tabMulti.classList.add('active', 'bg-blue-600', 'text-white', 'border-blue-600');
        tabMulti.classList.remove('border-gray-300', 'text-gray-600', 'bg-white');
        tabSingle.classList.remove('active', 'bg-blue-600', 'text-white', 'border-blue-600');
        tabSingle.classList.add('border-gray-300', 'text-gray-600', 'bg-white');
        panelMulti.classList.add('active');
        panelSingle.classList.remove('active');
      }
    }
    tabSingle.addEventListener('click', () => activateTab(true));
    tabMulti.addEventListener('click', () => activateTab(false));

    // Helper functions
    function setProgress(filePct, detailText, cssIdx, cssTotal, totalBytes, currentFileName) {
      currentPercent.textContent = `${Math.round(filePct)}%`;
      progressBar.style.width = `${filePct}%`;
      if (detailText) progressDetail.textContent = detailText;
      overallCount.textContent = `CSS ${cssIdx}/${cssTotal}`;
      overallSize.textContent = formatBytes(totalBytes);
      if (currentFileName) currentFile.textContent = currentFileName;
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      if (bytes < 1024) return bytes + ' B';
      const kb = bytes / 1024;
      return kb < 1024 ? kb.toFixed(1) + ' KB' : (kb / 1024).toFixed(2) + ' MB';
    }

    function resetUI() {
      errorMsg.classList.add('hidden');
      downloadBtn.classList.add('hidden');
      progressContainer.classList.remove('hidden');
      setProgress(0, 'Starting...', 0, 0, 0, '—');
    }

    // Common scraping handler
    async function handleScrape(input) {
  resetUI();
  let lastInfo = null;

  try {
    const blob = await CssScraper.scrape(input, {
      proxyUrl: 'https://fetch-css.vercel.app/api/fetch-css',
      onProgress: (info) => {
        lastInfo = info;
        // ---- bar = overall progress ----
        progressBar.style.width = `${info.overallPercent}%`;
        // ---- label = current file progress ----
        currentPercent.textContent = `${Math.round(info.filePercent)}%`;
        if (info.detail) progressDetail.textContent = info.detail;
        overallCount.textContent = `CSS ${info.cssIndex}/${info.cssTotal}`;
        overallSize.textContent = formatBytes(info.overallBytes);
        if (info.currentFile) currentFile.textContent = info.currentFile;
      }
    });

    const blobUrl = URL.createObjectURL(blob);
    downloadBtn.href = blobUrl;
    downloadBtn.download = 'jCss.zip';
    downloadBtn.classList.remove('hidden');
    const cssTotal = lastInfo ? lastInfo.cssTotal : 1;
    const bytes = lastInfo ? lastInfo.overallBytes : 0;
    progressBar.style.width = '100%';
    currentPercent.textContent = '100%';
    overallCount.textContent = `CSS ${cssTotal}/${cssTotal}`;
    overallSize.textContent = formatBytes(bytes);
    progressDetail.textContent = 'Complete! Click download.';
    currentFile.textContent = '—';
    downloadBtn.addEventListener('click', () => setTimeout(() => URL.revokeObjectURL(blobUrl), 2000), { once: true });
  } catch (err) {
    errorMsg.textContent = err.message;
    errorMsg.classList.remove('hidden');
    progressContainer.classList.add('hidden');
  }
}

    // Single scrape button
    scrapeSingleBtn.addEventListener('click', async () => {
      const url = singleUrl.value.trim();
      if (!url) {
        errorMsg.textContent = 'Please enter a CSS URL.';
        errorMsg.classList.remove('hidden');
        return;
      }
      await handleScrape(url);
    });

    // Multi scrape button (from JSON textarea)
    scrapeMultiBtn.addEventListener('click', async () => {
      let urls;
      try {
        urls = JSON.parse(multiJson.value.trim());
        if (!Array.isArray(urls) || urls.length === 0) throw new Error('Invalid');
      } catch {
        errorMsg.textContent = 'Invalid JSON array. Example: ["url1.css", "url2.css"]';
        errorMsg.classList.remove('hidden');
        return;
      }
      await handleScrape(urls);
    });

    // Sample button for multi
    sampleBtn.addEventListener('click', () => {
      multiJson.value = JSON.stringify(window.SAMPLE_URLS, null, 2);
      // optionally trigger scrape automatically? We'll let the user click Scrape All
      // or we could auto-scrape. We'll just fill the textarea.
      // Then call the same handler? The button "Scrape All" already does that.
      // We'll just fill the textarea and focus the Scrape All button.
      // Better: just fill and let the user decide, but we can also automatically scrape:
      // For convenience, we'll auto-scrape after filling.
      // But to respect user intent, we'll just fill the textarea.
    });
