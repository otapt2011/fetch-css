        <i class="fa-solid fa-file-zipper"></i> Download jCss.zip

  <!-- ======================== MAIN LOGIC ======================== -->
  <script>
    const PROXY = 'https://fetch-css.vercel.app/api/fetch-css';

    const imageExtensions = new Set(['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'ico', 'bmp', 'tiff']);
    const fontExtensions = new Set(['woff', 'woff2', 'ttf', 'otf', 'eot']);

    function getCategory(filename) {
      const ext = filename.substring(filename.lastIndexOf('.') + 1).toLowerCase();
      if (imageExtensions.has(ext)) return 'images';
      if (fontExtensions.has(ext)) return 'fonts';
      return 'assets';
    }

    // DOM elements
    const jsonInput = document.getElementById('jsonInput');
    const fetchBtn = document.getElementById('fetchBtn');
    const sampleBtn = document.getElementById('sampleBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const currentPercent = document.getElementById('currentPercent');
    const currentFile = document.getElementById('currentFile');
    const progressDetail = document.getElementById('progressDetail');
    const overallCount = document.getElementById('overallCount');
    const overallSize = document.getElementById('overallSize');
    const downloadBtn = document.getElementById('downloadBtn');
    const errorMsg = document.getElementById('errorMsg');

    function setCurrentProgress(percent, detailText) {
      currentPercent.textContent = `${Math.round(percent)}%`;
      progressBar.style.width = `${percent}%`;
      if (detailText) progressDetail.textContent = detailText;
    }

    function setOverall(current, total, totalBytes) {
      overallCount.textContent = `CSS ${current}/${total}`;
      overallSize.textContent = formatBytes(totalBytes);
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      if (bytes < 1024) return bytes + ' B';
      const kb = bytes / 1024;
      return kb < 1024 ? kb.toFixed(1) + ' KB' : (kb / 1024).toFixed(2) + ' MB';
    }

    // Helper: fetch with streaming progress
    async function fetchWithProgress(url, onProgress) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const contentLength = response.headers.get('content-length');
      const total = contentLength ? parseInt(contentLength, 10) : null;
      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (onProgress) onProgress(received, total);
      }
      return new Blob(chunks);
    }

    // Core scraping function for a list of URLs
    async function processUrls(urls) {
      errorMsg.classList.add('hidden');
      downloadBtn.classList.add('hidden');
      progressContainer.classList.remove('hidden');

      setOverall(0, urls.length, 0);
      setCurrentProgress(0, 'Starting...');
      currentFile.textContent = '—';

      let totalBytesDownloaded = 0;
      const globalAssets = new Map(); // absoluteUrl -> { localName, category, blob }
      const cssFiles = [];

      for (let i = 0; i < urls.length; i++) {
        const url = urls[i].trim();
        const cssFilename = url.substring(url.lastIndexOf('/') + 1) || 'style.css';
        currentFile.textContent = cssFilename;
        setOverall(i + 1, urls.length, totalBytesDownloaded);

        // 1. Fetch CSS with streaming progress
        setCurrentProgress(0, 'Downloading CSS…');
        let cssBlob;
        try {
          cssBlob = await fetchWithProgress(
            `${PROXY}?url=${encodeURIComponent(url)}`,
            (received, total) => {
              if (total) {
                const pct = (received / total) * 20;
                setCurrentProgress(pct, `Downloading CSS (${formatBytes(received)} / ${formatBytes(total)})`);
              }
            }
          );
        } catch (e) {
          throw new Error(`Failed to fetch ${url}: ${e.message}`);
        }
        const cssText = await cssBlob.text();
        const cssSize = cssBlob.size;
        totalBytesDownloaded += cssSize;
        setOverall(i + 1, urls.length, totalBytesDownloaded);
        setCurrentProgress(20, 'Analyzing assets…');

        // 2. Extract asset URLs
        const urlRegex = /url\(\s*["']?(?!data:)([^"')]+)["']?\s*\)/gi;
        const matches = [...cssText.matchAll(urlRegex)];
        const baseUrl = url.substring(0, url.lastIndexOf('/') + 1);
        const fileAssets = new Map(); // absoluteUrl -> { start, end, originalMatch }

        for (const match of matches) {
          let rawPath = match[1].trim().replace(/^["']|["']$/g, '');
          if (rawPath.startsWith('http://') || rawPath.startsWith('https://') || rawPath.startsWith('//')) continue;
          try {
            const absoluteUrl = new URL(rawPath, baseUrl).href;
            if (!fileAssets.has(absoluteUrl)) {
              if (!globalAssets.has(absoluteUrl)) {
                let filename = absoluteUrl.substring(absoluteUrl.lastIndexOf('/') + 1);
                const qIdx = filename.indexOf('?');
                if (qIdx !== -1) filename = filename.substring(0, qIdx);
                if (!filename) filename = 'asset';
                let unique = filename;
                const usedNames = new Set(Array.from(globalAssets.values()).map(v => v.localName));
                let counter = 1;
                while (usedNames.has(unique)) {
                  const dot = filename.lastIndexOf('.');
                  unique = dot !== -1
                    ? filename.substring(0, dot) + `_${counter}` + filename.substring(dot)
                    : filename + `_${counter}`;
                  counter++;
                }
                globalAssets.set(absoluteUrl, {
                  localName: unique,
                  category: getCategory(filename),
                  blob: null
                });
              }
              fileAssets.set(absoluteUrl, {
                start: match.index,
                end: match.index + match[0].length,
                originalMatch: match[0]
              });
            }
          } catch (e) { /* ignore */ }
        }

        // 3. Download assets (only those not yet downloaded)
        const assetsNeeded = Array.from(fileAssets.keys()).filter(
          absUrl => !globalAssets.get(absUrl).blob
        );
        const totalAssets = assetsNeeded.length;

        if (totalAssets > 0) {
          const assetProgressStart = 20;
          const assetProgressEnd = 90;
          const assetProgressRange = assetProgressEnd - assetProgressStart;

          for (let j = 0; j < assetsNeeded.length; j++) {
            const assetUrl = assetsNeeded[j];
            const info = globalAssets.get(assetUrl);
            const detailText = `Asset ${j+1}/${totalAssets}: ${info.localName}`;
            setCurrentProgress(
              assetProgressStart + (assetProgressRange * (j / totalAssets)),
              detailText
            );

            try {
              const assetBlob = await fetchWithProgress(
                `${PROXY}?url=${encodeURIComponent(assetUrl)}`,
                (received, total) => {
                  const stepSize = assetProgressRange / totalAssets;
                  const assetFraction = total ? received / total : 0;
                  const assetStart = assetProgressStart + stepSize * j;
                  const pct = assetStart + (assetFraction * stepSize);
                  setCurrentProgress(pct, detailText);
                }
              );
              const blobSize = assetBlob.size;
              totalBytesDownloaded += blobSize;
              globalAssets.get(assetUrl).blob = assetBlob;
              setOverall(i + 1, urls.length, totalBytesDownloaded);
            } catch (e) {
              console.warn(`Skipped ${assetUrl}: ${e.message}`);
              setCurrentProgress(
                assetProgressStart + (assetProgressRange * ((j + 1) / totalAssets)),
                `Skipped ${info.localName}`
              );
            }
          }
        }

        // 4. Rewrite CSS
        setCurrentProgress(90, 'Rewriting CSS…');
        let rewritten = cssText;
        const replacements = [];
        for (const [absUrl, { start, end, originalMatch }] of fileAssets) {
          const info = globalAssets.get(absUrl);
          if (!info.blob) continue;
          const localPath = `${info.category}/${info.localName}`;
          replacements.push({ start, end, originalMatch, localPath });
        }
        replacements.sort((a, b) => b.start - a.start);
        for (const { start, end, originalMatch, localPath } of replacements) {
          const hasQuotes = /url\(\s*["']/.test(originalMatch);
          const newUrl = hasQuotes ? `url("${localPath}")` : `url(${localPath})`;
          rewritten = rewritten.substring(0, start) + newUrl + rewritten.substring(end);
        }

        // Generate unique CSS filename for zip
        const parsedUrl = new URL(url);
        let zipCssName = parsedUrl.pathname.substring(parsedUrl.pathname.lastIndexOf('/') + 1);
        if (!zipCssName) zipCssName = 'style.css';
        const qIdx = zipCssName.indexOf('?');
        if (qIdx !== -1) zipCssName = zipCssName.substring(0, qIdx);
        const usedNames = new Set(cssFiles.map(f => f.filename));
        let uniqueCssName = zipCssName;
        let counter = 1;
        while (usedNames.has(uniqueCssName)) {
          const dot = zipCssName.lastIndexOf('.');
          uniqueCssName = dot !== -1
            ? zipCssName.substring(0, dot) + `_${counter}` + zipCssName.substring(dot)
            : zipCssName + `_${counter}`;
          counter++;
        }
        cssFiles.push({ filename: uniqueCssName, content: rewritten });

        setCurrentProgress(100, 'Done');
      }

      // 5. Build ZIP
      setCurrentProgress(0, 'Building zip…');
      const zip = new JSZip();
      for (const { filename, content } of cssFiles) {
        zip.file(filename, content);
      }
      for (const [absUrl, { localName, category, blob }] of globalAssets) {
        if (blob) {
          zip.folder(category).file(localName, blob);
        }
      }
      const zipBlob = await zip.generateAsync({ type: 'blob' }, meta => {
        setCurrentProgress(meta.percent, `Compressing… ${meta.percent.toFixed(0)}%`);
      });

      const blobUrl = URL.createObjectURL(zipBlob);
      downloadBtn.href = blobUrl;
      downloadBtn.download = 'jCss.zip';
      downloadBtn.classList.remove('hidden');
      setCurrentProgress(100, 'Complete! Click download.');
      overallCount.textContent = `CSS ${urls.length}/${urls.length}`;
      downloadBtn.addEventListener('click', () => setTimeout(() => URL.revokeObjectURL(blobUrl), 2000), { once: true });
    }

    // "Scrape All" button: parse textarea and run
    fetchBtn.addEventListener('click', async () => {
      let urls;
      try {
        urls = JSON.parse(jsonInput.value.trim());
        if (!Array.isArray(urls) || urls.length === 0) throw new Error('Invalid array');
      } catch {
        errorMsg.textContent = 'Invalid JSON array. Example: ["url1.css", "url2.css"]';
        errorMsg.classList.remove('hidden');
        return;
      }
      try {
        await processUrls(urls);
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
        progressContainer.classList.add('hidden');
      }
    });

    // "Scrape Sample" button: use the predefined SAMPLE_URLS array
    sampleBtn.addEventListener('click', async () => {
      try {
        await processUrls(window.SAMPLE_URLS);
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
        progressContainer.classList.add('hidden');
      }
    });
  </script>
