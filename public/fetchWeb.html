<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fetch Web Stylesheets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-size: 14px; }
    textarea { resize: vertical; }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">
  <!-- Header -->
  <header class="bg-white shadow-sm px-3 py-2 flex items-center gap-2 flex-shrink-0">
    <i class="fa-solid fa-globe text-blue-600 text-lg"></i>
    <h1 class="text-base font-semibold text-gray-800">Fetch Stylesheets</h1>
    <a href="cssScrapper.html" class="ml-auto text-xs text-blue-600 hover:text-blue-800 transition">
      <i class="fa-solid fa-scroll mr-1"></i>Scraper
    </a>
  </header>

  <!-- Main -->
  <main class="flex-1 overflow-y-auto p-2 flex items-start justify-center">
    <div class="w-full max-w-md space-y-2 mt-2">
      <div class="space-y-1">
        <label class="block text-xs text-gray-600">Webpage URL</label>
        <div class="flex gap-1">
          <input id="pageUrl" type="url" placeholder="https://example.com"
                 class="flex-1 px-2 py-1.5 text-xs border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-400">
          <button id="fetchBtn" class="px-3 py-1.5 bg-blue-600 text-white text-xs rounded hover:bg-blue-700 transition">
            <i class="fa-solid fa-magnifying-glass mr-1"></i>Fetch
          </button>
        </div>
      </div>

      <!-- Loading -->
      <div id="loading" class="hidden text-xs text-blue-600">
        <i class="fa-solid fa-spinner fa-spin mr-1"></i>Fetching stylesheets…
      </div>

      <!-- Debug info -->
      <div id="debugInfo" class="hidden text-xs text-gray-500 space-y-1">
        <p><strong>Requested URL:</strong> <span id="debugRequested"></span></p>
        <p><strong>Final URL:</strong> <span id="debugFinal"></span></p>
        <p><strong>Stylesheets found:</strong> <span id="debugCount"></span></p>
      </div>

      <!-- Output -->
      <div id="outputContainer" class="hidden space-y-1">
        <label class="block text-xs text-gray-600">Resolved CSS URLs (JSON array)</label>
        <textarea id="output" rows="8" readonly
                  class="w-full px-2 py-1.5 text-xs font-mono border border-gray-300 rounded bg-gray-50"></textarea>
        <button id="copyBtn" class="w-full px-3 py-1.5 bg-green-600 text-white text-xs rounded hover:bg-green-700 transition">
          <i class="fa-solid fa-copy mr-1"></i>Copy to Clipboard
        </button>
        <p id="copyMsg" class="hidden text-xs text-green-600">Copied!</p>
      </div>

      <p id="errorMsg" class="hidden text-xs text-red-600"></p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t px-3 py-1.5 flex-shrink-0 text-xs text-gray-500 text-center">
    <i class="fa-regular fa-copyright"></i> Fetch Stylesheets Tool
  </footer>

  <script>
    const API = 'https://fetch-css.vercel.app/api/fetch-html';

    const pageUrlInput = document.getElementById('pageUrl');
    const fetchBtn = document.getElementById('fetchBtn');
    const loading = document.getElementById('loading');
    const debugInfo = document.getElementById('debugInfo');
    const debugRequested = document.getElementById('debugRequested');
    const debugFinal = document.getElementById('debugFinal');
    const debugCount = document.getElementById('debugCount');
    const outputContainer = document.getElementById('outputContainer');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');
    const copyMsg = document.getElementById('copyMsg');
    const errorMsg = document.getElementById('errorMsg');

    fetchBtn.addEventListener('click', async () => {
      const url = pageUrlInput.value.trim();
      if (!url) {
        errorMsg.textContent = 'Please enter a webpage URL.';
        errorMsg.classList.remove('hidden');
        return;
      }

      errorMsg.classList.add('hidden');
      outputContainer.classList.add('hidden');
      debugInfo.classList.add('hidden');
      loading.classList.remove('hidden');
      output.value = '';

      try {
        // Add debug=true to see final URL and more details
        const response = await fetch(`${API}?url=${encodeURIComponent(url)}&debug=true`);
        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${response.status}`);
        }
        const data = await response.json();

        // Show debug info
        debugRequested.textContent = data.url || url;
        debugFinal.textContent = data.finalUrl || '(unknown)';
        debugCount.textContent = data.stylesheets ? data.stylesheets.length : 0;
        debugInfo.classList.remove('hidden');

        // Show the stylesheets as JSON array
        output.value = JSON.stringify(data.stylesheets, null, 2);
        outputContainer.classList.remove('hidden');
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
      }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(output.value);
        copyMsg.classList.remove('hidden');
        setTimeout(() => copyMsg.classList.add('hidden'), 2000);
      } catch (err) {
        copyMsg.textContent = 'Copy failed. Please copy manually.';
        copyMsg.classList.remove('hidden');
        copyMsg.classList.add('text-red-600');
      }
    });
  </script>
</body>
</html>
